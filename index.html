<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variable.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    
    <title>Article Preview Component</title>
</head>

<body>
    <main class="container-principal">
        <div class="img-container">
            <img src="./images/drawers.jpg" alt="Imagem ambiente sala de estar com uma cômoda e uma planta">
        </div>
        <div class="info-container">
            <h1>Shift the overall look and feel by adding these wonderful touches to furniture in your home</h1>
            <h2>Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting.
                I’ve got some simple tips to help you make any room feel complete.</h2>
            <div class="author-container">
                <div class="author-info">
                    <div class="author-avatar">
                        <img src="./images/avatar-michelle.jpg" alt="Imagem do autor">
                    </div>
                    <div class="author-name">
                        <p>Michelle Appleton</p>
                        <span>28 Jun 2020</span>
                    </div>
                </div>
                <div class="share-social">
                    <img src="./images/icon-share.svg" alt="Botão de compartilhamento">
                </div>
            </div>
        </div>
    </main>
</body>

</html>
